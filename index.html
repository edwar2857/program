<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haz tu pedido</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#f7f6f1;--surface:#fff;--ink:#1d2a44;--muted:#5d6980;--line:#dfe2e8;--accent:#f4c542;--accent-ink:#1d2a44;--wa:#128c4a;--wa-ink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a2d;--surface:#1a2640;--ink:#eef1f7;--muted:#a3adc2;--line:#2c3a5a;--wa:#25a65f}}
:root[data-theme="dark"]{--bg:#111a2d;--surface:#1a2640;--ink:#eef1f7;--muted:#a3adc2;--line:#2c3a5a;--wa:#25a65f}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:70px;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 110px}
h1,h2,h3{font-family:"Bricolage Grotesque",Georgia,serif;margin:0;letter-spacing:-.02em}
.hero{padding:36px 0 18px}
.hero h1{font-size:clamp(2.4rem,10vw,4.2rem);font-weight:800;line-height:.98}
.hero p{color:var(--muted);margin:12px 0 0;max-width:48ch}
.info{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.info span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.9rem}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 0;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 16px;font:500 .95rem "DM Sans",sans-serif;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat h2{font-size:1.5rem;margin:28px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{position:relative;aspect-ratio:4/3;background:var(--c,#ddd);display:grid;place-items:center;font:800 3rem "Bricolage Grotesque",serif;color:rgba(255,255,255,.85);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.body h3{font-size:1.05rem;font-weight:600}
.body p{margin:0;color:var(--muted);font-size:.9rem;flex:1}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.price{font-weight:700}
.tag{position:absolute;top:8px;left:8px;z-index:1;border-radius:999px;padding:4px 10px;font:700 .8rem "DM Sans",sans-serif}
.tag.out{background:#c0392b;color:#fff}
.tag.low{background:var(--accent);color:var(--accent-ink)}
.card.off .ph{filter:grayscale(1);opacity:.6}
.card.off .body h3,.card.off .body p,.card.off .price{opacity:.6}
.soldout{font-weight:700;color:#c0392b;font-size:.9rem}
.qty button:disabled,.q2 button:disabled{opacity:.35;cursor:not-allowed}
.qty{display:flex;align-items:center;gap:6px}
.qty button,.q2 button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-size:19px;line-height:1;cursor:pointer}
.qty .add{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qty span,.q2 span{min-width:18px;text-align:center;font-weight:700}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
footer{margin:40px 0 0;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line);padding-top:16px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar>div{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:12px}
.tot{flex:1;font-weight:700}
.tot small{display:block;font-weight:400;color:var(--muted)}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:13px 22px;font:700 1rem "DM Sans",sans-serif;cursor:pointer}
.btn.wa{background:var(--wa);color:var(--wa-ink);width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
dialog{border:0;border-radius:18px;padding:0;width:min(520px,calc(100% - 24px));max-height:88vh;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,15,30,.55)}
.sh{padding:18px;display:grid;gap:12px}
.sh header{display:flex;justify-content:space-between;align-items:center}
.sh h2{font-size:1.4rem}
.x{background:none;border:0;color:var(--ink);font-size:26px;cursor:pointer}
.li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.li b{flex:1;font-weight:500}
.q2{display:flex;align-items:center;gap:6px}
.sum{display:flex;justify-content:space-between;font-weight:700;font-size:1.1rem}
label{display:grid;gap:4px;font-weight:500;font-size:.95rem}
input[type=text],input[type=tel],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
.modes{display:flex;gap:8px}
.modes label{flex:1;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:8px;padding:10px;cursor:pointer}
.err{color:#c0392b;font-size:.9rem;min-height:1.2em;margin:0}
</style>
</head>
<body>
<main class="wrap">
<section class="hero">
<h1 id="neg"></h1>
<p id="lema"></p>
<div class="info" id="info"></div>
</section>
<nav class="tabs" id="tabs" aria-label="Categorías"></nav>
<div id="menu"></div>
<footer id="foot"></footer>
</main>

<div class="bar"><div>
<div class="tot"><span id="tot"></span><small id="cnt"></small></div>
<button class="btn" id="ver" disabled>Ver pedido</button>
</div></div>

<dialog id="dlg"><div class="sh">
<header><h2>Tu pedido</h2><button class="x" id="cl" aria-label="Cerrar">×</button></header>
<div id="lines"></div>
<div class="sum"><span>Total</span><span id="t2"></span></div>
<label>Nombre<input type="text" id="nom" autocomplete="name"></label>
<div class="modes" role="radiogroup" aria-label="Entrega">
<label><input type="radio" name="m" value="Recojo en tienda" checked> Recojo</label>
<label><input type="radio" name="m" value="Delivery"> Delivery</label>
</div>
<label id="dirL" hidden>Dirección de entrega<input type="text" id="dir" autocomplete="street-address"></label>
<label>Notas (opcional)<textarea id="not" rows="2" placeholder="Hora de recojo, sin azúcar, etc."></textarea></label>
<p class="err" id="err" role="alert"></p>
<button class="btn wa" id="go">Enviar por WhatsApp</button>
</div></dialog>

<script src="firebase-config.js"></script>
<script>
var TELEFONO, MONEDA = "S/", NEGOCIO = "", LEMA = "", DATOS = [], PRODUCTOS = [], cats = [], BAJO = 5;
var cart = {}, $ = function(i){return document.getElementById(i)};
var fmt = function(n){return MONEDA+" "+n.toFixed(2)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

$("tabs").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;
  document.querySelectorAll("#tabs button").forEach(function(x){x.classList.toggle("on",x===b)});
  $("cat"+b.dataset.c).scrollIntoView();
});

function st(p){ return p.off ? 0 : (p.stock==null ? Infinity : p.stock); }
function badge(p){
  if(p.off) return '<span class="tag out">Agotado</span>';
  if(p.stock!=null && p.stock<=BAJO) return '<span class="tag low">'+(p.stock===1?'¡Última unidad!':'¡Quedan '+p.stock+'!')+'</span>';
  return '';
}
function photo(p){
  var inner = p.img ? '<img src="'+esc(p.img)+'" alt="'+esc(p.n)+'" loading="lazy" onerror="this.parentNode.textContent=this.alt.charAt(0)">' : esc(p.n.charAt(0));
  return '<div class="ph" style="--c:'+p.col+'">'+badge(p)+inner+'</div>';
}
function render(){
  $("menu").innerHTML = cats.map(function(c,i){
    return '<section class="cat" id="cat'+i+'"><h2>'+esc(c)+'</h2><div class="grid">'+
    PRODUCTOS.filter(function(p){return p.c===c}).map(function(p){
      var q = cart[p.id]||0;
      return '<article class="card'+(p.off?' off':'')+'">'+photo(p)+'<div class="body"><h3>'+esc(p.n)+'</h3><p>'+esc(p.d)+'</p>'+
      '<div class="row"><span class="price">'+fmt(p.p)+'</span><div class="qty">'+
      (q?'<button aria-label="Quitar uno" data-a="-1" data-id="'+p.id+'">−</button><span>'+q+'</span>':'')+
      (p.off?'<span class="soldout">Agotado</span>':'<button class="add" aria-label="Agregar '+esc(p.n)+'" data-a="1" data-id="'+p.id+'"'+(q>=st(p)?' disabled':'')+'>+</button>')+'</div></div></div></article>';
    }).join("")+'</div></section>';
  }).join("");
  totals();
}
function totals(){
  var t=0,n=0; PRODUCTOS.forEach(function(p){var q=cart[p.id]||0; t+=q*p.p; n+=q});
  $("tot").textContent = fmt(t); $("t2").textContent = fmt(t);
  $("cnt").textContent = n ? n+(n===1?" producto":" productos") : "Tu pedido está vacío";
  $("ver").disabled = !n;
  return t;
}
function change(id,d){
  var p = PRODUCTOS.filter(function(x){return String(x.id)===String(id)})[0], max = p ? st(p) : 0;
  cart[id] = Math.min(max, Math.max(0, (cart[id]||0)+d));
}
$("menu").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;
  change(b.dataset.id,+b.dataset.a); render();
  var s='button[data-id="'+b.dataset.id+'"][data-a="'+b.dataset.a+'"]', a=document.querySelector(s); if(a) a.focus();
});
function lines(){
  var h=""; PRODUCTOS.forEach(function(p){var q=cart[p.id]||0; if(q) h+='<div class="li"><b>'+esc(p.n)+'</b><div class="q2"><button data-a="-1" data-id="'+p.id+'" aria-label="Quitar uno">−</button><span>'+q+'</span><button data-a="1" data-id="'+p.id+'" aria-label="Agregar uno"'+(q>=st(p)?' disabled':'')+'>+</button></div><span>'+fmt(q*p.p)+'</span></div>'});
  $("lines").innerHTML = h;
  if(!h) $("dlg").close();
}
$("lines").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;
  change(b.dataset.id,+b.dataset.a); lines(); render();
});
$("ver").onclick=function(){ lines(); $("dlg").showModal(); };
$("cl").onclick=function(){ $("dlg").close(); };
document.querySelectorAll('input[name="m"]').forEach(function(r){
  r.addEventListener("change",function(){ $("dirL").hidden = document.querySelector('input[name="m"]:checked').value!=="Delivery"; });
});
$("go").onclick=function(){
  var nom=$("nom").value.trim(), del=document.querySelector('input[name="m"]:checked').value==="Delivery", dir=$("dir").value.trim();
  if(!nom){ $("err").textContent="Escribe tu nombre para enviar el pedido."; $("nom").focus(); return; }
  if(del && !dir){ $("err").textContent="Escribe la dirección de entrega."; $("dir").focus(); return; }
  $("err").textContent="";
  var t=0, ls=[]; PRODUCTOS.forEach(function(p){var q=cart[p.id]||0; if(q){t+=q*p.p; ls.push("• "+q+" x "+p.n+" – "+fmt(q*p.p));}});
  var nt=$("not").value.trim();
  var msg="Hola, quiero hacer un pedido en "+NEGOCIO+":\n\n"+ls.join("\n")+"\n\n*Total: "+fmt(t)+"*\n\nNombre: "+nom+"\nEntrega: "+(del?"Delivery a "+dir:"Recojo en tienda")+(nt?"\nNotas: "+nt:"");
  window.open("https://wa.me/"+TELEFONO+"?text="+encodeURIComponent(msg),"_blank","noopener");
};
var COLORES = ["#c98b3a","#9a6a35","#7d5a3a","#d9a441","#5b3a2e","#b5703d","#b8643c","#6f8a4a","#3f2b22","#e08a2b"];
function init(d){
  TELEFONO = String(d.telefono||"").replace(/\D/g,""); MONEDA = d.moneda||"S/"; NEGOCIO = d.negocio||"Mi tienda";
  LEMA = d.lema||""; DATOS = d.datos||[]; BAJO = d.stock_bajo!=null ? Number(d.stock_bajo) : 5;
  PRODUCTOS = (d.productos||[]).filter(function(p){return p.activo!==false}).map(function(p,i){
    return {id:p.id!=null?p.id:i+1, c:p.categoria||"Productos", n:p.nombre, d:p.descripcion||"", p:Number(p.precio)||0, img:p.foto||"", stock:(p.stock!=null && p.stock!=="" ? Number(p.stock) : null), off:(p.agotado===true || (p.stock!=null && p.stock!=="" && Number(p.stock)<=0)), col:p.color||COLORES[i%COLORES.length]};
  });
  PRODUCTOS.forEach(function(p){ if(cart[p.id]>st(p)) cart[p.id]=st(p); });
  cats = []; PRODUCTOS.forEach(function(p){ if(cats.indexOf(p.c)<0) cats.push(p.c); });
  $("neg").textContent = NEGOCIO; $("lema").textContent = LEMA;
  $("info").innerHTML = DATOS.map(function(x){return "<span>"+esc(x)+"</span>"}).join("");
  $("foot").textContent = NEGOCIO+(DATOS.length?" · "+DATOS.join(" · "):"");
  document.title = NEGOCIO+" – Haz tu pedido";
  $("tabs").innerHTML = cats.map(function(c,i){return '<button data-c="'+i+'"'+(i?'':' class="on"')+'>'+esc(c)+'</button>'}).join("");
  render();
}
function cargarJSON(){ fetch("productos.json?v="+Date.now(), {cache:"no-store"})
  .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(init)
  .catch(function(){
    $("neg").textContent = "No se pudo cargar productos.json";
    $("lema").textContent = "Abre la página desde un hosting o con un servidor local (ver LEEME.txt). Si abres index.html con doble clic, el navegador bloquea la lectura del JSON.";
  });
}
if(!window.USAR_FIREBASE) cargarJSON();
</script>
<script type="module">
// Tienda en vivo con Firebase: los cambios del mostrador aparecen sin recargar.
if(window.USAR_FIREBASE){
  const base = "https://www.gstatic.com/firebasejs/10.12.2/";
  try{
    const {initializeApp} = await import(base+"firebase-app.js");
    const {getFirestore,collection,doc,onSnapshot} = await import(base+"firebase-firestore.js");
    const db = getFirestore(initializeApp(window.FIREBASE_CONFIG));
    let neg = {}, prods = [], got = {n:false,p:false};
    const push = () => {
      if(!(got.n && got.p)) return;
      if(!prods.length && !neg.negocio) return window.cargarJSON();
      window.init(Object.assign({}, neg, {productos: prods}));
    };
    const fail = () => window.cargarJSON();
    onSnapshot(doc(db,"config","negocio"), s => { neg = s.exists()?s.data():{}; got.n = true; push(); }, fail);
    onSnapshot(collection(db,"productos"), s => {
      prods = s.docs.map(d => Object.assign({id:d.id}, d.data())).sort((a,b) => (a.orden||0)-(b.orden||0));
      got.p = true; push();
    }, fail);
  }catch(e){ window.cargarJSON(); }
}
</script>
</body>
</html>
